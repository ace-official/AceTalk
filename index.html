<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AceTalk - Bakım Modu</title>
    
    <!-- Ubuntu Font -->
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Ubuntu', sans-serif;
            background-color: #0b0f19;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Blurlu ve Karartılmış Arka Plan */
        body::before {
            content: "";
            position: absolute;
            top: -20px;
            left: -20px;
            right: -20px;
            bottom: -20px;
            background: url('Acetalkwallpaper.jpg') no-repeat center center fixed;
            background-size: cover;
            /* blur yanına brightness eklenerek görsel karartıldı */
            filter: blur(12px) brightness(0.4); 
            z-index: -1;
        }

        /* Dil Seçeneği Menüsü - Keskin Hatlar, Gölge Yok */
        .lang-switch {
            position: absolute;
            top: 30px;
            right: 40px;
            z-index: 20;
            display: flex;
            gap: 15px;
        }

        .lang-switch button {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 8px 16px;
            border-radius: 0; /* Sivri kenar */
            cursor: pointer;
            font-family: 'Ubuntu', sans-serif;
            font-weight: 700;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
        }

        .lang-switch button:hover {
            background: rgba(0, 168, 255, 0.5);
            border-color: #00a8ff;
        }

        /* Ana İçerik Konteyneri */
        .content {
            text-align: center;
            z-index: 10;
            position: relative;
            padding: 20px;
        }

        /* AceTalk Başlığı - Gölge Yok */
        h1#brand {
            font-size: 5rem;
            font-weight: 700;
            color: #00a8ff;
            margin-bottom: 20px;
            cursor: pointer;
            display: inline-block;
            user-select: none;
        }

        /* Titreme Animasyonu */
        @keyframes shake {
            0% { transform: translateX(0) rotate(0); }
            20% { transform: translateX(-6px) rotate(-3deg); }
            40% { transform: translateX(6px) rotate(3deg); }
            60% { transform: translateX(-4px) rotate(-2deg); }
            80% { transform: translateX(4px) rotate(2deg); }
            100% { transform: translateX(0) rotate(0); }
        }

        .shake {
            animation: shake 0.4s ease-in-out;
        }

        /* Gri Alt Metin - Gölge Yok */
        p#desc {
            font-size: 1.3rem;
            font-weight: 400;
            color: #a0a0a0;
            max-width: 600px;
            line-height: 1.5;
            margin: 0 auto;
        }

        /* Animasyonlar için Canvas */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
        }
    </style>
</head>
<body>

    <div class="lang-switch">
        <button onclick="setLang('tr')">TR</button>
        <button onclick="setLang('en')">EN</button>
    </div>

    <canvas id="cubeCanvas"></canvas>

    <div class="content">
        <h1 id="brand">AceTalk</h1>
        <p id="desc">Site şu an bakım modunda, gelişmeler için İnstagram hesabına bakmanız önerilir.</p>
    </div>

    <script>
        const texts = {
            tr: "Site şu an bakım modunda, gelişmeler için İnstagram hesabına bakmanız önerilir.",
            en: "The site is currently under maintenance, we recommend checking our Instagram account for updates."
        };

        function setLang(lang) {
            document.getElementById('desc').innerText = texts[lang];
        }

        const brand = document.getElementById('brand');
        brand.addEventListener('click', () => {
            brand.classList.remove('shake');
            void brand.offsetWidth; 
            brand.classList.add('shake');
        });

        const canvas = document.getElementById('cubeCanvas');
        const ctx = canvas.getContext('2d');
        const desc = document.getElementById('desc');

        let width, height;
        let cubes = [];

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        class Cube {
            constructor() {
                this.size = Math.random() * 15 + 10;
                this.x = Math.random() * width;
                this.y = -this.size - Math.random() * 200;
                this.vy = Math.random() * 1 + 0.5; 
                this.vx = (Math.random() - 0.5) * 0.5;
                this.gravity = 0.05; 
                this.bounciness = 0.4;
                this.rotation = Math.random() * Math.PI * 2;
                this.rotationSpeed = (Math.random() - 0.5) * 0.05;
                this.color = `rgba(0, 168, 255, ${Math.random() * 0.5 + 0.3})`;
            }

            update(brandRect, descRect) {
                this.vy += this.gravity;
                this.y += this.vy;
                this.x += this.vx;
                this.rotation += this.rotationSpeed;

                let cubeBottom = this.y + this.size;
                let cubeRight = this.x + this.size;
                let cubeCenter = this.x + this.size / 2;

                // Başlık ile çarpışma
                if (this.x < brandRect.right && cubeRight > brandRect.left) {
                    if (cubeBottom > brandRect.top && cubeBottom < brandRect.top + 30 && this.vy > 0) {
                        this.y = brandRect.top - this.size;
                        this.vy *= -this.bounciness;
                        
                        if (cubeCenter < brandRect.left + brandRect.width / 2) {
                            this.vx -= 0.3;
                        } else {
                            this.vx += 0.3;
                        }
                    }
                }

                // Alt metin ile çarpışma
                if (this.x < descRect.right && cubeRight > descRect.left) {
                    if (cubeBottom > descRect.top && cubeBottom < descRect.top + 30 && this.vy > 0) {
                        this.y = descRect.top - this.size;
                        this.vy *= -this.bounciness;
                        
                        if (cubeCenter < descRect.left + descRect.width / 2) {
                            this.vx -= 0.3;
                        } else {
                            this.vx += 0.3;
                        }
                    }
                }

                if (this.y > height + 50 || this.x < -50 || this.x > width + 50) {
                    this.y = -this.size - Math.random() * 100;
                    this.x = Math.random() * width;
                    this.vy = Math.random() * 1 + 0.5;
                    this.vx = (Math.random() - 0.5) * 0.5;
                }
            }

            draw() {
                ctx.save();
                ctx.translate(this.x + this.size / 2, this.y + this.size / 2);
                ctx.rotate(this.rotation);
                ctx.fillStyle = this.color;
                ctx.fillRect(-this.size / 2, -this.size / 2, this.size, this.size);
                ctx.strokeStyle = "rgba(0, 168, 255, 0.8)";
                ctx.strokeRect(-this.size / 2, -this.size / 2, this.size, this.size);
                ctx.restore();
            }
        }

        for (let i = 0; i < 15; i++) {
            cubes.push(new Cube());
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);

            const brandRect = brand.getBoundingClientRect();
            const descRect = desc.getBoundingClientRect();

            cubes.forEach(cube => {
                cube.update(brandRect, descRect);
                cube.draw();
            });

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
