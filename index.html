<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AceTalk - Under Development</title>
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #222222;
            color: #e0e0e0;
            font-family: 'Ubuntu', sans-serif;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .content {
            text-align: center;
            z-index: 10;
            background: rgba(34, 34, 34, 0.7);
            padding: 40px 60px;
            border: 1px solid #333;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
        }

        .logo-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .logo-container img {
            height: 50px;
        }

        h1 {
            font-size: 36px;
            margin: 0 0 10px 0;
            color: #ffffff;
            letter-spacing: -0.5px;
        }

        p {
            font-size: 16px;
            color: #bbbbbb;
            margin: 0;
        }

        .box {
            position: absolute;
            top: -10vh;
            background-color: #00aff0; /* AceTalk Mavi Accent */
            opacity: 0.3;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% {
                transform: translateY(-10vh) rotate(0deg);
                opacity: 0.5;
            }
            100% {
                transform: translateY(110vh) rotate(360deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <div class="content">
        <div class="logo-container">
            <img src="https://raw.githubusercontent.com/ace-official/AceTalk/main/AceTalklogoTP.png" alt="AceTalk">
            <h1>AceTalk</h1>
        </div>
        <h1>Under Development...</h1>
        <p>We are currently undergoing heavy maintenance to improve your experience.</p>
        <p style="margin-top: 10px; font-size: 13px; color: #00aff0;">We'll be back soon.</p>
    </div>

    <script>
        function createBoxes() {
            const body = document.body;
            for (let i = 0; i < 40; i++) {
                let box = document.createElement('div');
                box.className = 'box';
                
                let size = Math.random() * 40 + 10;
                box.style.width = size + 'px';
                box.style.height = size + 'px';
                box.style.left = Math.random() * 100 + 'vw';
                
                box.style.animationDuration = Math.random() * 4 + 3 + 's';
                box.style.animationDelay = Math.random() * 5 + 's';
                
                body.appendChild(box);
            }
        }
        createBoxes();
    </script>
</body>
</html>
